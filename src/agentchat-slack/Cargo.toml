[package]
name = "agentchat-slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Slack Socket Mode and Web API adapter for AgentChat"
license = "MIT"

[dependencies]
agentchat-core.workspace = true
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
unicode-general-category = "1"
regex = "1"
hmac = "0.12"
sha2 = "0.10"
url = "2"
html5gum = "0.7"
mime = "0.3"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
