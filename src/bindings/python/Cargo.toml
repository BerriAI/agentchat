doctest = false

[dependencies]
agentchat-core = { path = "../../agentchat-core" }
agentchat-slack = { path = "../../agentchat-slack" }
agentchat-providers = { path = "../../agentchat-providers" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
serde_json.workspace = true
async-trait.workspace = true
