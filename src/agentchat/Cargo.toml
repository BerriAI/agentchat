[package]
name = "agentchat"
description = "Connect messaging channels to application-owned agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
slack = ["dep:agentchat-slack"]
providers = ["dep:agentchat-providers"]

[dependencies]
agentchat-core.workspace = true
agentchat-providers = { workspace = true, optional = true }
agentchat-slack = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true

[[example]]
name = "slack_echo"
required-features = ["slack"]
