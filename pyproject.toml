[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentchat"
version = "0.1.0a1"
description = "Connect chat platforms to Python agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BerriAI" }]
dependencies = [
    "slack-sdk>=3.41,<4",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
openai = ["openai-agents>=0.4,<1"]
discord = ["discord.py>=2.6,<3"]
teams = [
    "microsoft-agents-hosting-aiohttp>=1.8,<2",
    "microsoft-agents-authentication-msal>=1.8,<2",
]
imessage = ["python-socketio[asyncio-client]>=5.13,<6"]
whatsapp = []  # Uses the existing aiohttp dependency.
telegram = []
dev = [
    "openai-agents>=0.4,<1",
    "discord.py>=2.6,<3",
    "microsoft-agents-hosting-aiohttp>=1.8,<2",
    "microsoft-agents-authentication-msal>=1.8,<2",
    "python-socketio[asyncio-client]>=5.13,<6",
    "pytest>=7.3,<9",
    "pytest-asyncio>=0.21,<1",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
