[workspace]
resolver = "2"
members = [
    "crates/agentchat",
    "crates/agentchat-core",
    "crates/agentchat-slack",
    "bindings/python",
    "bindings/node",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/BerriAI/agentchat"

[workspace.dependencies]
agentchat-core = { version = "=0.1.0-alpha.1", path = "crates/agentchat-core" }
agentchat-slack = { version = "=0.1.0-alpha.1", path = "crates/agentchat-slack" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
